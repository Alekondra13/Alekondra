 и впадин"},{name:"MACD",settings:"12, 26, 9",purpose:"Подтверждение затухания гистограммы"}],setupVisual:{type:"both",diagramDesc:"График цены делает два дна: второе дно НИЖЕ первого. В это же время график RSI под ним показывает второе дно ВЫШЕ первого. Формируется стрелка расхождения — мощный сигнал CALL."},rulesCall:["Цена на графике обновляет минимум (Low 2 ниже Low 1).","Линия RSI в этот же момент показывает повышающийся минимум (RSI Low 2 выше RSI Low 1).","Оба минимума RSI находятся вблизи или внутри зоны перепроданности (<38).","Появляется первая разворотная зеленая свеча (бычий пинбар или поглощение).","ВХОД: на закрытии подтверждающей зеленой свечи открываем CALL (ВВЕРХ) на 2-3 минуты."],rulesPut:["Цена на графике обновляет максимум (High 2 выше High 1).","Линия RSI в этот же момент показывает понижающийся пик (RSI High 2 ниже RSI High 1).","Оба пика RSI находятся вблизи зоны перекупленности (>62).","Появляется подтверждающая красная разворотная свеча.","ВХОД: на закрытии подтверждающей свечи открываем PUT (ВНИЗ) на 2-3 минуты."],exitAndRisk:{maxRiskPerTrade:"1% - 2% от депозита",martingalePolicy:"Не используется: фиксированная ставка, после минуса ждём новый валидный сигнал.",invalidationTrigger:"Новый импульс пробивает экстремум дивергенции с обновлением экстремума на RSI."},proTips:["Дивергенция на таймфрейме M1 с экспирацией 2-3 минуты дает достаточно времени для реализации разворота.","Если дивергенция совпадает с горизонтальным уровнем поддержки — качество сетапа заметно выше."],commonMistakes:["Вход до появления подтверждающей разворотной свечи (попытка поймать падающий нож)."]},{id:"price_action_pinbar",name:"Price Action: Пинбар и Отказ цены (Wick Rejection)",shortName:"Пинбар (Молот / Звезда)",category:"price_action",categoryLabel:"Чистый график (Price Action)",winrate:"не проверен",difficulty:"Для новичков",recommendedTimeframe:"M1 / S30 / M5",recommendedExpiry:"1 - 2 минуты",bestPairs:["EUR/USD","USD/CAD","GBP/USD","AUD/USD","GOLD"],tagline:"Бе ия тренда"}],setupVisual:{type:"both",diagramDesc:"Линии Стохастика опускаются ниже уровня 20 -> синяя линия пересекает оранжевую снизу вверх и обе линии выходят выше уровня 20 -> подтверждение CALL."},rulesCall:["Линии Стохастика опустились глубоко в зону перепроданности (ниже 20).","Быстрая линия %K пересекает медленную линию %D снизу вверх (золотой крест).","Обе линии разворачиваются и пересекают уровень 20 снизу вверх, выходя из зоны дна.","Желательно: цена находится около EMA 50 или горизонтальной поддержки.","ВХОД: на открытии следующей свечи открываем CALL (ВВЕРХ) на 1-2 минуты."],rulesPut:["Линии Стохастика поднялись в зону перекупленности (выше 80).","Быстрая линия %K пересекает линию %D сверху вниз (мертвый крест).","Обе линии пересекают уровень 80 сверху вниз, подтверждая начало коррекции.","ВХОД: на открытии следующей свечи открываем PUT (ВНИЗ) на 1-2 минуты."],exitAndRisk:{maxRiskPerTrade:"1% - 2% от депозита",martingalePolicy:"Не используется: фиксированная ставка, после минуса ждём новый валидный сигнал.",invalidationTrigger:"Повторный нырок Стохастика обратно в экстремальную зону."},proTips:["Наибольший процент побед достигается, когда сигналы берутся только в направлении EMA 50."],commonMistakes:["Вход в момент, когда линии только вошли в зону 80 или 20, не дожидаясь самого пересечения и разворота наружу."]},{id:"range_channel_trading",name:"Торговля во флэтовом коридоре (Range Box Trading)",shortName:"Торговля в канале",category:"levels",categoryLabel:"Флэтовые стратегии",winrate:"не проверен",difficulty:"Для новичков",recommendedTimeframe:"M1 / S30",recommendedExpiry:"2 - 3 минуты",bestPairs:["EUR/GBP","AUD/CAD","EUR/CHF","USD/CHF"],tagline:"Идеальная стратегия для спокойного азиатского и ночного рынка в боковых диапазонах",description:"Более 70% времени рынок проводит в боковике (флэте). Стратегия Range Box определяет четкий прямоугольный коридор между верхней границей (потолком) и нижней границей (полом). Трейдер покупает у пола коридора с целью к потолку, и продает у потолка с целью к полу.",indicatorsUsed:[{name:"Прямоугольный канал (Box)",settings:"Минимум 2 касания сверху и 2 снизу",purpose:"Определение границ коридора"},{name:"RSI 14 или Williams %R",settings:"Стандарт",purpose:"Подтверждение перекупленности/перепроданности у стенок"}],setupVisual:{type:"both",diagramDesc:"Цена ходит между параллельными горизонтальными линиями поддержки и сопротивления, как мячик. Вход от нижней стенки вверх, от верхней стенки вниз."},rulesCall:["На графике сформирован четкий горизонтальный коридор (боковик).","Цена касается нижней границы коридора и не может ее пробить.","Свеча закрывается внутри диапазона с формированием нижней тени.","ВХОД: открываем CALL (ВВЕРХ) на 2-3 минуты с расчетом на ход цены к середине коридора."],rulesPut:["Цена касается верхней границы коридора.","Свеча закрывается внутри диапазона с формированием верхней тени отбоя.","ВХОД: открываем PUT (ВНИЗ) на 2-3 минуты с целью к противоположной границе."],exitAndRisk:{maxRiskPerTrade:"1% - 2% от депозита",martingalePolicy:"Не используется: фиксированная ставка, после минуса ждём новый валидный сигнал.",invalidationTrigger:"Свеча закрылась телом за пределами коридора (начало трендового выхода)."},proTips:["Лучшее время для этой стратегии — ночные сессии или периоды затишья перед выходом важных новостей."],commonMistakes:["Попытка торговать в коридоре во время открытия американской или европейской сессий, когда происходят пробои."]}];const QF="ФИЛЬТР КАЧЕСТВА: берём сетап только при ADX ≥ 20, направлении не против EMA 50 на M5, отсутствии важных новостей ±15 мин и выплате ≥ 80%.";An.forEach(s=>{[s.rulesCall,s.rulesPut].forEach(a=>a.splice(Math.max(a.length-1,0),0,QF))});
const GD=[["1. Как работать (60 секунд на сделку)",["Выберите инструмент слева и таймфрейм сверху. Полный анализ идёт по реальным котировкам крипто-пар (Binance); остальные инструменты анализируйте через вкладку «Скриншот».","Ждите сигнал CALL/PUT с оценкой A или A+. «ОЖИДАНИЕ / ПРОПУСК» означает, что входа нет — это нормальный результат.","Откройте блок «Фильтры качества» справа: все пункты должны быть ✅. Один ⛔ — сделку не открываем.","Входите на открытии СЛЕДУЮЩЕЙ свечи (:00), не догоняйте ушедшую. Экспирация — как рекомендует бот (1–2 мин для M1).","Ставку берите из вкладки «Риск-план» (скриншот) или по правилам ниже."]],["2. Как читать сигнал",["Оценка A+ / A — сколько основных слоёв (тренд, осцилляторы, price action, уровни) согласны: A+ = 4 из 4, A = 3 из 4. Волатильность может только запретить вход.","«Уверенность» — рейтинг качества сетапа, а не вероятность выигрыша; выше 88% он намеренно не поднимается.","Сигнал выдаётся, только если пройдены все 16 фильтров: реальные котировки, перевес слоёв, консенсус ≥ 3/4, нет слоя против, ADX ≥ 20, не против сильного тренда, старший таймфрейм не против, нет погони за движением, нет ценового спайка, не у стены уровня, RSI не исчерпан, нормальная волатильность, подтверждающая свеча, план помощника (пауза/грейд) и окно входа.","Движок определяет режим рынка (тренд / флэт / смешанный) и меняет вес слоёв: в тренде ищет входы по тренду и на откатах, а не против него; направление сверяет со старшим таймфреймом (в 5 раз крупнее текущего). Экспирация: 1 свеча в тренде, 2 свечи в остальных случаях.","Сигнал считается по ЗАКРЫТЫМ свечам и не перерисовывается. Окно входа — первые 15–20 с новой свечи; позже ждите следующую."]],["3. Скриншот из Pocket Option",["Ctrl+V или «Вставить фото». Крупный чистый график без рисунков поверх даёт лучшее распознавание.","Если свечи не распознаны — сигнал не выдаётся. Сделайте новый снимок.","Таймер: 🟢 0–18 с — сигнал актуален; 🟡 18–42 с — ждите :00 новой свечи; 🔴 42 с+ — снимок устарел."]],["4. Риск-менеджмент",["Ставка 1–2% депозита, не больше. Мартингейл отключён: после минуса ставку не повышаем.","3 минуса подряд — закрыть терминал на 2–3 часа. +10% к балансу за сессию — остановиться.","Точка безубыточности: при выплате 85% нужно около 54% прибыльных сделок, при 80% — около 56%."]],["5. Когда не торговать",["За 15 минут до и после важных новостей (NFP, CPI, решения ЦБ).","Во флэте (ADX < 20), при спайках волатильности и в первые минуты открытия сессий.","После серии минусов или при желании «отыграться»."]],["6. Помощник сессии (внизу)",["Нажмите на полосу «🤖 Помощник сессии». После каждой сделки напишите «минус» или «плюс» (можно с суммой: «минус 20»). Один раз укажите «баланс 1000».","После минуса помощник включает паузу и снижает ставку, после 2 минусов — только A+, после 3 — стоп на 3 часа. Его план напрямую блокирует сигналы (фильтры «План помощника»).","Лимиты сессии по умолчанию: −5% — стоп до завтра, +10% — зафиксировать прибыль, максимум 12 сделок; меняются командами «стоп 4», «цель 8», «макс 10». Мартингейл и «отыграться» помощник не поддерживает.","Ещё помощник умеет: «сигнал» — объяснить, почему входа нет или что сейчас на графике; «отмена» — удалить ошибочную запись; «статистика» — винрейт, безубыточность, результаты по сигналам и без них, слабые пары; «пауза 15» / «продолжить»; «выплата 85». Он замечает рост ставки после минуса, слишком частые входы и слабую форму и сам ужесточает план.","Это локальный помощник на правилах (не нейросеть, без интернета): он считает ваш план, а не предсказывает рынок."]],["7. Важно знать",["Ни одна стратегия не гарантирует прибыль. Бинарные опционы — высокорисковый инструмент, большинство частных трейдеров теряют деньги.","Процент побед в карточках стратегий не подтверждён. Оценивайте только свою статистику: демо-счёт, минимум 100 сделок.","Это аналитический инструмент, а не финансовая рекомендация."]]];
const AS0={jr:[],bal:null,cfg:{},msgs:[{b:1,t:"Привет! Я локальный помощник сессии (работаю по правилам, без интернета). После каждой сделки пишите «минус» или «плюс» (можно с суммой: «минус 20»). Ещё понимаю: «баланс 1000», «сигнал», «план», «статистика», «отмена», «стоп 4», «цель 8», «макс 10», «выплата 85», «пауза 15», «сброс», «помощь». Я пересчитаю паузу, ставку и допустимые сигналы."}]};
function planOf(jr,now,bal,cfg){cfg=cfg||{};const SL=cfg.stop>0?cfg.stop:5,TP=cfg.goal>0?cfg.goal:10,MX=cfg.max>0?cfg.max:12;let cl=0;for(let i=jr.length-1;i>=0&&jr[i].r==="L";i--)cl++;let ws=0;for(let i=jr.length-1;i>=0&&jr[i].r==="W";i--)ws++;const la=jr[jr.length-1],pnl=jr.reduce((a,e)=>a+(e.r==="W"?1:-1)*(e.amt||0),0);let stake=1.5,minA="A",until=Math.max(0,cfg.hold||0),why=cfg.hold>now?"Ручная пауза.":"Всё штатно: ставка 1–2%, сигналы A/A+.";let run=0;for(const e of jr){if(e.r==="L"){run++;until=Math.max(until,e.t+(run===1?12e4:run===2?6e5:108e5))}else run=0}if(cl===1){stake=1;why="1 минус: пауза 2 мин, ставка 1%, без повышения."}if(cl===2){stake=.5;minA="A+";why="2 минуса подряд: пауза 10 мин, ставка 0.5%, только A+."}if(cl>=3){stake=0;why="3 минуса подряд: СТОП на 3 часа."}const l8=jr.slice(-8),w8=l8.filter(e=>e.r==="W").length;if(l8.length>=6&&w8/l8.length<=.34&&cl<2){minA="A+";stake=Math.min(stake,.75);why="Слабая форма ("+w8+" из "+l8.length+" последних): только A+, ставка не выше 0.75%."}if(bal&&pnl<0&&pnl<=-bal*SL/100*.6&&cl<3){minA="A+";stake=Math.min(stake,.5);why="Просадка "+(-pnl/bal*100).toFixed(1)+"% при лимите −"+SL+"%: только A+, ставка 0.5%."}if(la&&jr.filter(e=>now-e.t<3e5).length>=3){until=Math.max(until,la.t+3e5);why="Слишком частые входы (3 за 5 минут): пауза 5 мин. Торгуем реже и только по сигналам."}if(bal&&pnl<=-bal*SL/100){stake=0;until=Math.max(until,la.t+432e5);why="Дневной лимит −"+SL+"% достигнут: стоп до завтра."}if(bal&&pnl>=bal*TP/100){stake=0;until=Math.max(until,la.t+432e5);why="Цель +"+TP+"% достигнута: зафиксируйте прибыль и завершите сессию."}if(jr.length>=MX){stake=0;until=Math.max(until,la.t+432e5);why="Лимит "+MX+" сделок за сессию."}return{cl,ws,pnl,stake,minA,until,why,blocked:now<until,key:cl+"|"+(now<until?1:0)+"|"+minA+"|"+stake,n:jr.length,w:jr.filter(e=>e.r==="W").length,SL,TP,MX}}
function asReply(tx,st,cx,now){const t=tx.toLowerCase().replace(/ё/g,"е").replace(/(\d)\s(?=\d{3}(?!\d))/g,"$1").trim(),m=t.match(/(\d+(?:[.,]\d+)?)/),num=m?parseFloat(m[1].replace(",",".")):0;let jr=st.jr,bal=st.bal,cfg={...(st.cfg||{})},r;const pay=cfg.pay>0?cfg.pay:cx.pay>0?cx.pay:85,be=100/(100+pay)*100,P=()=>planOf(jr,now,bal,cfg),rd=n=>Math.round(n*100)/100,fm=n=>{const q=Math.max(0,Math.round((n-now)/1e3));return q>=3600?Math.floor(q/3600)+" ч "+Math.floor(q%3600/60)+" мин":Math.floor(q/60)+":"+String(q%60).padStart(2,"0")},tail=()=>{const p=P();return p.blocked?"⏸ Следующий вход — через "+fm(p.until)+".":"▶ Вход только по сигналу "+(p.minA==="A+"?"A+":"A/A+")+" со всеми ✅."+(bal&&p.stake?" Ставка: "+p.stake+"% ≈ "+(bal*p.stake/100).toFixed(2)+".":"")},rec=res=>{const prev=jr[jr.length-1],p0=P();let amt=num,est=0;if(!amt&&bal&&p0.stake){amt=rd(bal*p0.stake/100*(res==="W"?pay/100:1));est=1}jr=[...jr,{t:now,r:res,amt,est,pair:cx.pair,sig:cx.sig,g:cx.grade||""}];const p=P(),w=[];if(est)w.push("Сумму оценил по ставке плана.");if(res==="L"&&bal&&num>bal*.025)w.push("Ставка "+num+" — это "+(num/bal*100).toFixed(1)+"% баланса, выше разумных 1–2%.");if(res==="L"&&prev&&prev.r==="L"&&prev.amt>0&&num>prev.amt*1.3)w.push("⚠️ Ставка выросла после минуса ("+prev.amt+" → "+num+") — это мартингейл, так депозит сгорает быстрее.");if(prev&&now-prev.t<45e3)w.push("Записи идут слишком часто: входите только по сигналу, а не серией.");return{p,w:w.join(" ")}};
